            - generic [ref=f1e19] [cursor=pointer]: I own this app, or I have permission from the person who does to test it.
          - paragraph [ref=f1e20]: Quietword sends about thirty requests from its own server, over roughly twenty seconds. It never signs in, never sends anything designed to break your app, and refuses any address on a private network.
        - paragraph [ref=f1e66]: Running the five checks. This takes up to twenty five seconds.

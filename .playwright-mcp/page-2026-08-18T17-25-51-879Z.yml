      - generic [ref=f1e49]:
        - heading "What it does not cover" [level=2] [ref=f1e50]
        - paragraph [ref=f1e51]: Quietword looks at your app from outside, the same way a stranger would. It cannot see your database access rules, your dependencies, the code behind your login, or anything in your repository. Five checks catch the problems that come up most. They do not catch every problem.
      - generic [ref=f1e52]:
        - heading "Or have a person read it" [level=2] [ref=f1e53]
        - paragraph [ref=f1e54]: "The scan is a starting point. A review is me going through your app by hand: the parts the scan cannot reach, your database access rules, what your login actually protects, and which of the scan findings matter for your app rather than in general."
        - paragraph [ref=f1e55]: You get a written list of what to fix, ordered by what I would do first, in the same plain language as the scan. No tooling to install and no code knowledge needed to read it. £150, usually back within three days.
